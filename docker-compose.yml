services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    environment:
      WATCHFILES_FORCE_POLLING: "true"
      PYTHONUNBUFFERED: "1"
      GUIDEBOOK_CSV: /data/IBD보험가이드북.csv
      RAG_EMBEDDINGS: /data/rag/IBD_insurance_guide_2024.embeddings.jsonl
      HF_HOME: /cache/huggingface
      TOKENIZERS_PARALLELISM: "false"
    env_file:
      - ./data/RAG/.env
    volumes:
      - ./backend/app:/app/app
      - ./data/IBD보험가이드북.csv:/data/IBD보험가이드북.csv:ro
      - ./data/RAG:/data/rag:ro
      - hf_cache:/cache/huggingface
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
  hf_cache:
